<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador — Em Manutenção · Bolão CRQ 2026</title>
<style>
  
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap');
:root{--gold:#FFB800;--navy:#020B1E;--navy-card:#0D1F3C;--cyan:#00D4FF;--white:#FFFFFF;--grey:#8899BB;--green:#00FF88;--purple:#a78bfa;--purple-dark:#7c3aed;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Rajdhani',sans-serif;background:var(--navy);color:var(--white);min-height:100vh;}
.topbar{position:sticky;top:0;z-index:50;background:rgba(2,11,30,0.97);backdrop-filter:blur(20px);border-bottom:1px solid rgba(167,139,250,0.2);padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
.topbar-title{font-family:'Orbitron',monospace;font-size:.95rem;font-weight:700;color:var(--purple);letter-spacing:.1em;display:flex;align-items:center;gap:.6rem;}
.back-link{font-family:'Orbitron',monospace;font-size:.7rem;color:var(--grey);text-decoration:none;letter-spacing:.08em;border:1px solid rgba(255,255,255,.15);padding:.5rem 1rem;transition:all .2s;}
.back-link:hover{color:var(--white);border-color:var(--purple);}
main{max-width:1200px;margin:0 auto;padding:2.5rem 1.5rem 5rem;}
.page-header{text-align:center;margin-bottom:2.5rem;}
.page-header h1{font-family:'Orbitron',monospace;font-size:clamp(1.4rem,4vw,2rem);font-weight:900;color:var(--white);margin-bottom:.6rem;}
.page-header h1 span{color:var(--purple);}
.page-header p{color:var(--grey);font-size:.9rem;max-width:560px;margin:0 auto;line-height:1.6;}
.loading,.empty-state{text-align:center;padding:4rem 1rem;color:var(--grey);}
.empty-icon{font-size:3rem;margin-bottom:1rem;}
.sim-wrapper{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;align-items:start;}
@media(max-width:800px){.sim-wrapper{grid-template-columns:1fr;}}
.sim-matches{display:flex;flex-direction:column;gap:.9rem;}
.sim-match{background:rgba(13,31,60,0.8);border:1px solid rgba(167,139,250,0.2);padding:1.1rem 1.4rem;position:relative;transition:border-color .2s;}
.sim-match::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--purple),var(--purple-dark));}
.sim-match.has-result::before{background:linear-gradient(180deg,var(--green),#0a8a5f);}
.sim-teams{display:flex;align-items:center;gap:.6rem;margin-bottom:.8rem;}
.sim-team{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1rem;color:var(--white);flex:1;}
.sim-team.right{text-align:right;}
.sim-vs{font-family:'Orbitron',monospace;font-size:.65rem;color:var(--grey);}
.sim-inputs{display:flex;align-items:center;justify-content:center;gap:.6rem;}
.sim-score-input{width:56px;background:rgba(0,0,0,.4);border:1px solid rgba(167,139,250,.3);color:var(--white);font-family:'Orbitron',monospace;font-size:1.3rem;font-weight:700;text-align:center;padding:.45rem .2rem;outline:none;transition:border-color .2s;}
.sim-score-input:focus{border-color:var(--purple);}
.sim-dash{font-family:'Orbitron',monospace;font-size:1.1rem;color:var(--grey);}
.sim-real-badge{font-size:.65rem;font-family:'Orbitron',monospace;color:var(--green);letter-spacing:.06em;margin-top:.5rem;text-align:center;}
.sim-podium{background:rgba(13,31,60,0.6);border:1px solid rgba(167,139,250,0.15);padding:1.4rem;position:sticky;top:90px;}
.sim-podium-title{font-family:'Orbitron',monospace;font-size:.75rem;letter-spacing:.15em;color:var(--purple);margin-bottom:1.2rem;text-align:center;}
.sim-podium-empty{color:var(--grey);font-size:.88rem;text-align:center;padding:2.5rem 0;font-style:italic;}
.sim-rank-row{display:flex;align-items:center;gap:.9rem;padding:.7rem .4rem;border-bottom:1px solid rgba(255,255,255,.04);}
.sim-rank-row:last-child{border-bottom:none;}
.sim-rank-pos{font-size:1.1rem;width:28px;text-align:center;}
.sim-rank-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-size:.78rem;font-weight:700;flex-shrink:0;}
.sim-rank-avatar.av1{background:linear-gradient(135deg,var(--gold),#FF8C00);color:var(--navy);}
.sim-rank-avatar.av2{background:linear-gradient(135deg,#aaa,#666);color:var(--navy);}
.sim-rank-avatar.av3{background:linear-gradient(135deg,#cd7f32,#8B4513);color:var(--white);}
.sim-rank-info{flex:1;min-width:0;}
.sim-rank-name{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:.92rem;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sim-rank-delta{font-size:.68rem;font-family:'Orbitron',monospace;display:block;margin-top:.15rem;}
.sim-rank-delta.up{color:var(--green);}
.sim-rank-delta.same{color:var(--grey);}
.sim-rank-total{font-family:'Orbitron',monospace;font-size:1.05rem;font-weight:900;}
.sim-rank-pts-label{font-size:.62rem;color:var(--grey);font-family:'Orbitron',monospace;text-align:right;}
.sim-hint{font-size:.74rem;color:var(--grey);text-align:center;margin-top:1rem;font-style:italic;}
.sim-separator{height:1px;background:linear-gradient(90deg,transparent,rgba(167,139,250,.3),transparent);margin:.6rem 0;}
.reset-btn{display:block;margin:1.5rem auto 0;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);color:var(--grey);font-family:'Orbitron',monospace;font-size:.65rem;letter-spacing:.08em;padding:.6rem 1.4rem;cursor:pointer;transition:all .2s;}
.reset-btn:hover{color:var(--white);border-color:var(--purple);}
.sim-section-label{font-family:'Orbitron',monospace;font-size:.62rem;letter-spacing:.14em;padding:.35rem .6rem;margin:.9rem 0 .5rem;display:flex;align-items:center;gap:.5rem;}
.sim-section-label.rodada{color:var(--cyan);border-left:2px solid var(--cyan);}
.sim-section-label.geral{color:var(--gold);border-left:2px solid var(--gold);}
.sim-rank-row.geral-row{background:rgba(255,184,0,.03);}
.sim-rank-avatar.av4{background:linear-gradient(135deg,#1a3a5c,#0d2040);color:var(--cyan);border:1px solid rgba(0,212,255,.3);}
.sim-rank-avatar.av5{background:linear-gradient(135deg,#1a3a5c,#0d2040);color:var(--cyan);border:1px solid rgba(0,212,255,.3);}
.sim-rank-avatar.av6{background:linear-gradient(135deg,#1a3a5c,#0d2040);color:var(--cyan);border:1px solid rgba(0,212,255,.3);}
.sim-rank-avatar.av7{background:linear-gradient(135deg,#1a3a5c,#0d2040);color:var(--cyan);border:1px solid rgba(0,212,255,.3);}


  .manutencao-wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .manutencao-icon {
    font-size: 4rem;
    margin-bottom: 1.5rem;
    animation: spin-slow 8s linear infinite;
  }

  @keyframes spin-slow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .manutencao-tag {
    font-family: 'Orbitron', monospace;
    font-size: .65rem;
    letter-spacing: .35em;
    color: var(--gold);
    text-transform: uppercase;
    padding: .4rem 1.2rem;
    border: 1px solid rgba(255,184,0,.25);
    background: rgba(255,184,0,.05);
    margin-bottom: 1.5rem;
    display: inline-block;
  }

  .manutencao-title {
    font-family: 'Orbitron', monospace;
    font-size: clamp(1.8rem, 5vw, 3rem);
    font-weight: 900;
    color: var(--white);
    line-height: 1.1;
    margin-bottom: .5rem;
  }

  .manutencao-title span {
    background: linear-gradient(135deg, var(--gold), #FF8C00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .manutencao-sub {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.1rem;
    color: var(--grey);
    margin-bottom: 2.5rem;
    max-width: 400px;
  }

  .manutencao-line {
    width: 80px;
    height: 2px;
    background: linear-gradient(90deg, var(--gold), var(--cyan));
    margin: 0 auto 2.5rem;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: .6rem;
    background: transparent;
    border: 1px solid rgba(0,212,255,.3);
    color: var(--cyan);
    font-family: 'Orbitron', monospace;
    font-size: .75rem;
    font-weight: 600;
    letter-spacing: .1em;
    padding: .85rem 2rem;
    cursor: pointer;
    text-decoration: none;
    clip-path: polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
    transition: all .3s;
  }

  .back-btn:hover {
    background: rgba(0,212,255,.08);
    border-color: var(--cyan);
  }

  /* Animated background grid */
  .bg-grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,.03) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 70% 70% at center, black, transparent);
    z-index: 0;
  }

  .dots {
    display: flex;
    gap: .5rem;
    justify-content: center;
    margin-bottom: 2rem;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--gold);
    animation: dot-pulse 1.4s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: .2s; }
  .dot:nth-child(3) { animation-delay: .4s; }

  @keyframes dot-pulse {
    0%,80%,100% { transform: scale(.6); opacity: .4; }
    40% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>

<div class="bg-grid"></div>

<div class="topbar">
  <div class="topbar-title">🔮 SIMULADOR DE PALPITES</div>
  <a href="bolao_crq_2026.html" class="back-link">← VOLTAR AO BOLÃO</a>
</div>

<div class="manutencao-wrap">
  <div class="manutencao-icon">⚙️</div>
  <div class="manutencao-tag">Aviso do Sistema</div>
  <h1 class="manutencao-title">EM <span>MANUTENÇÃO</span></h1>
  <div class="manutencao-line"></div>
  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
  <p class="manutencao-sub">O simulador está temporariamente indisponível. Voltará em breve com melhorias!</p>
  <a href="bolao_crq_2026.html" class="back-btn">← Voltar ao Bolão</a>
</div>

</body>
</html>
