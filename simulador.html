<script>

const PTS={EXATO:50,VENC_GOL:40,RESULTADO:30,GOL_UM:10,PP:20};
let participants = [];
let results = {};
let simPlacar = {};

function initials(nome){const p=nome.trim().split(' ').filter(Boolean);return p.length>=2?(p[0][0]+p[p.length-1][0]).toUpperCase():p[0]?.[0]?.toUpperCase()||'?';}

function calcScore(p){
  let total=0;
  for(const j of p.jogos){
    const key=j.fase==='grupos'?`g${j.idx}`:`mm${j.jogo}`;
    const res=results[key];
    if(!res||res.golsM===null||res.golsM===undefined||res.golsV===null||res.golsV===undefined)continue;
    if(j.golsM===null||j.golsV===null)continue;
    const pM=j.golsM,pV=j.golsV,rM=Number(res.golsM),rV=Number(res.golsV);
    if(pM===rM&&pV===rV){total+=PTS.EXATO;}
    else{
      const rv=rM>rV?'M':rM<rV?'V':'E',pv=pM>pV?'M':pM<pV?'V':'E',ok=rv===pv,aM=pM===rM,aV=pV===rV;
      if(ok&&(aM||aV)){total+=PTS.VENC_GOL;}
      else if(ok){total+=PTS.RESULTADO;}
      else if(aM||aV){total+=PTS.GOL_UM;}
    }
    if(j.fase!=='grupos'){
      if(res.mandante&&j.mandante===res.mandante)total+=PTS.PP;
      if(res.visitante&&j.visitante===res.visitante)total+=PTS.PP;
    }
  }
  // Bônus fixo de classificação de grupo
  if(results.bonusGrupoFixado && results.bonusGrupoFixado[p.nome]!==undefined){
    total += results.bonusGrupoFixado[p.nome];
  }
  return total;
}

function calcPtsSimulado(j, simResults){
  const key = j.fase==='grupos' ? `g${j.idx}` : `mm${j.jogo}`;
  const r = simResults[key];
  if(!r || r.gM===null || r.gM===undefined || r.gV===null || r.gV===undefined) return null;
  if(j.golsM===null||j.golsV===null) return null;
  const pM=j.golsM, pV=j.golsV, rM=Number(r.gM), rV=Number(r.gV);
  if(pM===rM && pV===rV) return 50;
  const rv=rM>rV?'M':rM<rV?'V':'E', pv=pM>pV?'M':pM<pV?'V':'E';
  if(rv===pv && (pM===rM||pV===rV)) return 40;
  if(rv===pv) return 30;
  if(pM===rM||pV===rV) return 10;
  return 0;
}

function getPtsReal(j,key){
  const r=results[key];
  if(!r||r.golsM===null||r.golsM===undefined||r.golsV===null||r.golsV===undefined||j.golsM===null||j.golsV===null)return 0;
  const pM=j.golsM,pV=j.golsV,rM=Number(r.golsM),rV=Number(r.golsV);
  if(pM===rM&&pV===rV)return 50;
  const rv=rM>rV?'M':rM<rV?'V':'E',pv=pM>pV?'M':pM<pV?'V':'E';
  if(rv===pv&&(pM===rM||pV===rV))return 40;
  if(rv===pv)return 30;
  if(pM===rM||pV===rV)return 10;
  return 0;
}

function getPPReal(j,key){
  // Retorna os pontos PP reais de um jogo eliminatório já com resultado lançado
  const r=results[key];
  if(!r||r.golsM===null||r.golsM===undefined||r.golsV===null||r.golsV===undefined) return 0;
  if(j.fase==='grupos') return 0;
  let pp=0;
  if(r.mandante&&j.mandante===r.mandante) pp+=PTS.PP;
  if(r.visitante&&j.visitante===r.visitante) pp+=PTS.PP;
  return pp;
}

function calcScoreSim(p, jogosHojeSet){
  // Base: pontuação real atual completa
  let base = calcScore(p);
  // Subtrai os pontos (PJ + PP) dos jogos de hoje que já têm resultado real
  // para depois substituir pelos pontos simulados
  for(const j of p.jogos){
    const key = j.fase==='grupos' ? `g${j.idx}` : `mm${j.jogo}`;
    if(!jogosHojeSet.has(key)) continue;
    const r = results[key];
    if(r && r.golsM!==null && r.golsM!==undefined && r.golsV!==null && r.golsV!==undefined){
      base -= getPtsReal(j, key);
      base -= getPPReal(j, key);
    }
  }
  // Adiciona pontos simulados (PJ) dos jogos de hoje
  let simExtra = 0;
  for(const j of p.jogos){
    const key = j.fase==='grupos' ? `g${j.idx}` : `mm${j.jogo}`;
    if(!jogosHojeSet.has(key)) continue;
    const pts = calcPtsSimulado(j, simPlacar);
    if(pts !== null) simExtra += pts;
    // PP simulado: usa os nomes oficiais do admin como resultado simulado
    if(j.fase!=='grupos'){
      const resOficial = results[key];
      if(resOficial && resOficial.mandante && resOficial.visitante){
        if(j.mandante===resOficial.mandante) simExtra+=PTS.PP;
        if(j.visitante===resOficial.visitante) simExtra+=PTS.PP;
      }
    }
  }
  return {total: base + simExtra, simExtra};
}

function getJogosHoje(){
  const agora = new Date();
  const hojeStr = agora.toLocaleDateString('pt-BR',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'});
  const DATAS_JOGOS = buildDatasJogos();
  const jogosHoje = [];
  for(const [key, dataJogo] of Object.entries(DATAS_JOGOS)){
    const dStr = dataJogo.toLocaleDateString('pt-BR',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'});
    if(dStr === hojeStr) jogosHoje.push(key);
  }
  return jogosHoje;
}

function render(){
  const el = document.getElementById('content');
  if(!participants.length){
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><div>Nenhum palpite carregado ainda no bolão.</div></div>`;
    return;
  }
  const jogosHoje = getJogosHoje();
  if(!jogosHoje.length){
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">📅</div><div>Nenhum jogo programado para hoje.</div></div>`;
    return;
  }
  const jogosHojeSet = new Set(jogosHoje);

  const jogoInfos = jogosHoje.map(key=>{
    let mandante='?', visitante='?';
    // Prioriza os nomes OFICIAIS resolvidos pelo admin (results[key]),
    // já que nos jogos eliminatórios cada palpiteiro escreveu nomes diferentes.
    const resOficial = results[key];
    if(resOficial && resOficial.mandante && resOficial.visitante){
      mandante = resOficial.mandante;
      visitante = resOficial.visitante;
    } else {
      // Fallback: usa o palpite do primeiro participante (fase de grupos)
      for(const p of participants){
        const j = key.startsWith('g')
          ? p.jogos.find(j=>j.fase==='grupos'&&`g${j.idx}`===key)
          : p.jogos.find(j=>j.fase!=='grupos'&&`mm${j.jogo}`===key);
        if(j){mandante=j.mandante; visitante=j.visitante; break;}
      }
    }
    const real = results[key];
    const temReal = real && real.golsM!==null && real.golsM!==undefined && real.golsV!==null && real.golsV!==undefined;
    if(temReal && simPlacar[key]===undefined){
      simPlacar[key] = {gM: Number(real.golsM), gV: Number(real.golsV)};
    }
    return {key, mandante, visitante, temReal, real};
  });

  let matchesHTML = jogoInfos.map((info,idx)=>{
    const cur = simPlacar[info.key];
    const gM = (cur && cur.gM!==null && cur.gM!==undefined) ? cur.gM : '';
    const gV = (cur && cur.gV!==null && cur.gV!==undefined) ? cur.gV : '';
    const hasResult = cur && cur.gM!==null && cur.gV!==null && cur.gM!==undefined && cur.gV!==undefined;
    const realBadge = info.temReal
      ? `<div class="sim-real-badge">✅ RESULTADO REAL: ${info.real.golsM} x ${info.real.golsV}</div>` : '';
    return `<div class="sim-match${hasResult?' has-result':''}" id="sim-match-${idx}">
      <div class="sim-teams">
        <span class="sim-team">${info.mandante}</span>
        <span class="sim-vs">VS</span>
        <span class="sim-team right">${info.visitante}</span>
      </div>
      <div class="sim-inputs">
        <input class="sim-score-input" type="number" min="0" max="20" value="${gM}"
          placeholder="0" oninput="simUpdate('${info.key}','M',this.value,${idx})" id="sim-m-${idx}">
        <span class="sim-dash">×</span>
        <input class="sim-score-input" type="number" min="0" max="20" value="${gV}"
          placeholder="0" oninput="simUpdate('${info.key}','V',this.value,${idx})" id="sim-v-${idx}">
      </div>
      ${realBadge}
    </div>`;
  }).join('');

  const podioHTML = buildSimPodium(jogosHojeSet);

  el.innerHTML = `<div class="sim-wrapper">
    <div class="sim-matches">${matchesHTML}</div>
    <div class="sim-podium">
      <div class="sim-podium-title">🏆 PROJEÇÃO SIMULADA</div>
      <div id="sim-podium-inner">${podioHTML}</div>
      <div class="sim-hint">Preencha os placares à esquerda para atualizar a projeção</div>
    </div>
  </div>`;
}

function buildSimPodium(jogosHojeSet){
  const algumPlacar = Object.keys(simPlacar).some(k=>{
    const s=simPlacar[k]; return s && s.gM!==null && s.gV!==null && s.gM!==undefined && s.gV!==undefined;
  });
  if(!algumPlacar) return `<div class="sim-podium-empty">Digite um placar ao lado<br>para ver a projeção</div>`;

  const ranked = participants.map(p=>{
    const sim = calcScoreSim(p, jogosHojeSet);
    return {nome:p.nome, total:sim.total, simExtra:sim.simExtra};
  });

  // Top 3 da RODADA: quem somou mais pts nos jogos de hoje
  const topRodada = [...ranked].sort((a,b)=>b.simExtra-a.simExtra).slice(0,3);
  const medalha = ['🥇','🥈','🥉'];
  const avatarCls = ['av1','av2','av3'];

  const rowsRodada = topRodada.map((p,i)=>{
    const delta = p.simExtra > 0
      ? `<span class="sim-rank-delta up">+${p.simExtra} pts nesta rodada</span>`
      : `<span class="sim-rank-delta same">sem ganhos hoje</span>`;
    const nomeParts = p.nome.split(' ');
    const nomeShort = nomeParts.length>1 ? `${nomeParts[0]} ${nomeParts[nomeParts.length-1]}` : p.nome;
    return `<div class="sim-rank-row">
      <span class="sim-rank-pos">${medalha[i]}</span>
      <div class="sim-rank-avatar ${avatarCls[i]}">${initials(p.nome)}</div>
      <div class="sim-rank-info">
        <div class="sim-rank-name">${nomeShort}</div>
        ${delta}
      </div>
      <div style="text-align:right">
        <span class="sim-rank-total" style="color:${i===0?'#FFB800':i===1?'#aaa':'#cd7f32'}">${p.simExtra}</span>
        <div class="sim-rank-pts-label">pts rodada</div>
      </div>
    </div>`;
  }).join('<div class="sim-separator"></div>');

  // Top 4 do RANKING GERAL: maior pontuação acumulada
  const topGeral = [...ranked].sort((a,b)=>b.total-a.total).slice(0,4);

  const rowsGeral = topGeral.map((p,i)=>{
    const nomeParts = p.nome.split(' ');
    const nomeShort = nomeParts.length>1 ? `${nomeParts[0]} ${nomeParts[nomeParts.length-1]}` : p.nome;
    const posLabel = `${i+1}º`;
    return `<div class="sim-rank-row geral-row">
      <span class="sim-rank-pos" style="font-family:'Orbitron',monospace;font-size:.75rem;color:var(--gold)">${posLabel}</span>
      <div class="sim-rank-avatar av${i+4}">${initials(p.nome)}</div>
      <div class="sim-rank-info">
        <div class="sim-rank-name">${nomeShort}</div>
        <span class="sim-rank-delta up">+${p.simExtra} hoje</span>
      </div>
      <div style="text-align:right">
        <span class="sim-rank-total" style="color:var(--gold)">${p.total}</span>
        <div class="sim-rank-pts-label">pts total</div>
      </div>
    </div>`;
  }).join('<div class="sim-separator"></div>');

  return `
    <div class="sim-section-label rodada">⚡ TOP 3 DA RODADA</div>
    ${rowsRodada}
    <div class="sim-section-label geral" style="margin-top:1.2rem">🏅 TOP 4 RANKING GERAL</div>
    ${rowsGeral}
  `;
}

function simUpdate(key, lado, val, idx){
  if(!simPlacar[key]) simPlacar[key] = {gM:null, gV:null};
  const v = val==='' ? null : Math.max(0,parseInt(val)||0);
  if(lado==='M') simPlacar[key].gM = v;
  else simPlacar[key].gV = v;

  const card = document.getElementById(`sim-match-${idx}`);
  if(card){
    const s=simPlacar[key];
    if(s&&s.gM!==null&&s.gV!==null) card.classList.add('has-result');
    else card.classList.remove('has-result');
  }
  const jogosHoje = getJogosHoje();
  const inner = document.getElementById('sim-podium-inner');
  if(inner) inner.innerHTML = buildSimPodium(new Set(jogosHoje));
}

function resetSim(){
  simPlacar = {};
  render();
}

async function loadData(){
  try{
    const pSnap = await db.collection('bolao').doc('participants').get();
    participants = pSnap.exists ? JSON.parse(pSnap.data().data||'[]') : [];
    const rSnap = await db.collection('bolao').doc('results').get();
    results = rSnap.exists ? JSON.parse(rSnap.data().data||'{}') : {};
  }catch(e){
    document.getElementById('content').innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div>Erro ao carregar dados: ${e.message}</div></div>`;
    return;
  }
  render();
}

loadData();
</script>
